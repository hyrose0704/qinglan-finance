name: Build Qinglan WeChat Mini Program
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:wechat
      - uses: actions/upload-artifact@v4
        with:
          name: qinglan-wechat
          path: dist-wechat/
          if-no-files-found: error
